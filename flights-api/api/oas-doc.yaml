openapi: 3.1.0
info:
  version: 1.0.0
  title: flights
  description: API for flights
paths:
  /api/v1/flight:
    get:
      description: Returns all flight
      operationId: getflight
      responses:
        "200":
          description: Flights list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/flights"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      description: Creates a new flights
      operationId: addFlights
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/flights"
        description: Flights to be created
        required: true
      responses:
        "201":
          description: Flights
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /api/v1/flight/{id}:
    get:
      description: Returns a single flights by its id
      operationId: findByid
      parameters:
        - required: true
          name: id
          description: id of the flights to fetch
          in: path
          schema:
            type: number
      responses:
        "200":
          description: Flights found by id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/flights"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    put:
      description: Update a flights based on its id
      operationId: updateFlights
      parameters:
        - required: true
          name: id
          description: id of the flights to update
          in: path
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/flights"
        description: Flights to be updated
        required: true
      responses:
        "204":
          description: Flights updated
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    delete:
      description: Deletes a single flights based on its id
      operationId: deleteFlights
      parameters:
        - required: true
          name: id
          description: id of the flights to delete
          in: path
          schema:
            type: number
      responses:
        "204":
          description: Flights deleted
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
components:
  schemas:
    flights:
      type: object
      required:
        - id
      properties:
        id:
          type: number
        flightNumber:
          type: string
        airline:
          type: string
        departure:
          type: object
        arrival:
          type: object
        aircraft:
          type: string
        seatCapacity:
          type: number
        seatsAvailable:
          type: number
        price:
          type: object
        hasWifi:
          type: boolean
    error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
      additionalProperties: true
