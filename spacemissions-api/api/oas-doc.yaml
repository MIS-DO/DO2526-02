openapi: 3.1.0
info:
  version: 1.0.0
  title: SpaceMissions API
  description: Generated with OAS TOOLS CLI 

paths:
  /api/v1/spacemissions:
    get:
      description: Returns all spacemissions
      operationId: getSpaceMissions
      responses:
        200:
          description: SpaceMission list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/spacemission'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    post:
      description: Creates a new spacemission
      operationId: addSpaceMission
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/spacemission'
        description: SpaceMission to be created
        required: true
      responses:
        201:
          description: SpaceMission
        default:
            description: Unexpected error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/error'
  /api/v1/spacemissions/{id}:
    get:
      description: Returns a single spacemission by its id
      operationId: findByid
      parameters:
        - required: true
          name: id
          description: id of the spacemission to fetch
          in: path
          schema:
            type: number
      responses:
        200:
          description: SpaceMission found by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/spacemission'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    put:
      description: Update a spacemission based on its id
      operationId: updateSpaceMission
      parameters:
        - required: true
          name: id
          description: id of the spacemission to update
          in: path
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/spacemission'
        description: SpaceMission to be updated
        required: true
      responses:
        204:
          description: SpaceMission updated
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    delete:
      description: Deletes a single spacemission based on its id
      operationId: deleteSpaceMission
      parameters:
        - required: true
          name: id
          description: id of the spacemission to delete
          in: path
          schema:
            type: number
      responses:
        204:
          description: SpaceMission deleted
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'

components:
  schemas:
    spacemission:
        type: object
        required:
          - id
        properties:
          id:
            type: number
          missionName:
            type: string
          status:
            type: string
          target:
            type: object
          launch:
            type: object
          crew:
            type: object
          financials:
            type: object
    error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
      additionalProperties: true
