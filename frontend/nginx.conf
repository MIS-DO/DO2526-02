# Redirige todo de HTTP a HTTPS
server {
    listen 80;
    server_name empleadomisionvuelo.app www.empleadomisionvuelo.app;
    return 301 https://$host$request_uri;
}

# Servidor principal seguro
server {
    listen 443 ssl;
    server_name empleadomisionvuelo.app www.empleadomisionvuelo.app;

    ssl_certificate /etc/letsencrypt/live/empleadomisionvuelo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/empleadomisionvuelo.app/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/employees {
        proxy_pass http://employees-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/flight {
        proxy_pass http://flights-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/spacemissions {
        proxy_pass http://spacemissions-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/search {
        proxy_pass http://search-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
