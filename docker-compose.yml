services:
  # ============================================
  # Employees API (rgavira123)
  # ============================================
  employees-api:
    build: ./employees-api
    container_name: employees-api
    ports:
      - "8001:8080"
    environment:
      - MONGODB_URI=mongodb://mongo-employees:27017
      - PORT=8080
      - NODE_ENV=development
    depends_on:
      mongo-employees:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  mongo-employees:
    image: mongo:6.0
    container_name: mongo-employees
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ============================================
  # Flights API (rafpulcif)
  # ============================================
  flights-api:
    build: ./flights-api
    container_name: flights-api
    ports:
      - "8002:8080"
    environment:
      - MONGODB_URI=mongodb://mongo-flights:27017
      - PORT=8080
      - NODE_ENV=development
    depends_on:
      mongo-flights:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  mongo-flights:
    image: mongo:6.0
    container_name: mongo-flights
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ============================================
  # SpaceMissions API (Danielruizlopezcc)
  # ============================================
  spacemissions-api:
    build: ./spacemissions-api
    container_name: spacemissions-api
    ports:
      - "8003:8080"
    environment:
      - MONGODB_URI=mongodb://mongo-spacemissions:27017
      - PORT=8080
      - NODE_ENV=development
    depends_on:
      mongo-spacemissions:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  mongo-spacemissions:
    image: mongo:6.0
    container_name: mongo-spacemissions
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ============================================
  # Frontend Unificado
  # ============================================
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - employees-api
      - flights-api
      - spacemissions-api
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
