services:
  mongo:
    image: mongo:6.0
    container_name: mongo-unified
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  employees-api:
    build: ./employees-api
    container_name: employees-api
    ports:
      - "8001:8080"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=do2526
      - PORT=8080
      - NODE_ENV=development
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  flights-api:
    build: ./flights-api
    container_name: flights-api
    ports:
      - "8002:8080"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=do2526
      - PORT=8080
      - NODE_ENV=development
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  spacemissions-api:
    build: ./spacemissions-api
    container_name: spacemissions-api
    ports:
      - "8003:8080"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=do2526
      - PORT=8080
      - NODE_ENV=development
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  search-api:
    build: ./search-api
    container_name: search-api
    ports:
      - "8004:8080"
    environment:
      - EMPLOYEES_API_URL=http://employees-api:8080
      - FLIGHTS_API_URL=http://flights-api:8080
      - SPACEMISSIONS_API_URL=http://spacemissions-api:8080
      - PORT=8080
      - NODE_ENV=development
    depends_on:
      - employees-api
      - flights-api
      - spacemissions-api
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - employees-api
      - flights-api
      - spacemissions-api
      - search-api
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  
volumes:
  mongo-data:
