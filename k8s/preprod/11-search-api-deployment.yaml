apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api-deployment
  namespace: preprod
  labels:
    app: search-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-api-pod
  template:
    metadata:
      labels:
        app: search-api-pod
    spec:
      containers:
        - name: search-api-container
          image: rgavira123/search-api:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          env:
            - name: EMPLOYEES_API_URL
              value: http://employees-api:8080
            - name: FLIGHTS_API_URL
              value: http://flights-api:8080
            - name: SPACEMISSIONS_API_URL
              value: http://spacemissions-api:8080
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: development
      restartPolicy: Always
