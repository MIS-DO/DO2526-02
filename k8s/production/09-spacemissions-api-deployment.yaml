apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacemissions-api-deployment
  namespace: production
  labels:
    app: spacemissions-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spacemissions-api-pod
  template:
    metadata:
      labels:
        app: spacemissions-api-pod
    spec:
      containers:
        - name: spacemissions-api-container
          image: rgavira123/spacemissions-api:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
          env:
            - name: MONGODB_URI
              value: mongodb://mongodb-service:27017
            - name: DB_NAME
              value: do2526
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: production
      restartPolicy: Always
